openapi: 3.0.3
info:
  title: AutoDev Studio API
  description: API for managing AI-powered software development projects
  version: 1.0.0
  contact:
    email: hello@autodev.live
  license:
    name: MIT

servers:
  - url: http://localhost:3100
    description: Local development server

paths:
  /health:
    get:
      summary: Health check endpoint
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  uptime:
                    type: number
                    example: 12345.67
                  timestamp:
                    type: string
                    format: date-time

  /metrics:
    get:
      summary: Service metrics
      operationId: getMetrics
      responses:
        '200':
          description: Service metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: object
                    additionalProperties:
                      type: integer
                  uptime:
                    type: number
                  timestamp:
                    type: string
                    format: date-time

  /api/projects:
    get:
      summary: List all projects
      operationId: listProjects
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
    post:
      summary: Create a new project
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'

components:
  schemas:
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [active, archived, deleted]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProjectInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string

    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        type:
          type: string
          enum: [client, server]

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'